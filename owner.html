<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="images/logo.jpg"><title>Aspen House Owner</title><style>body{font:17px system-ui;background:#f7f5ef;color:#293c32;margin:0}main{max-width:650px;margin:auto;padding:24px}h1{font:36px Georgia}label{display:block;margin:12px 0}input,textarea,button{box-sizing:border-box;font:inherit;padding:12px;border:1px solid #aab4a9;border-radius:8px;width:100%}button{background:#30483b;color:white;margin:8px 0;cursor:pointer}article,form{background:white;padding:16px;border-radius:12px;margin:14px 0}small{display:block} [hidden]{display:none!important}</style><main><h1>Aspen House Owner</h1><p id="status" role="status"></p><form id="login"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form><section id="dashboard" hidden><button id="logout">Sign out</button><h2>Reservations</h2><div id="list"></div><h2 id="formTitle">Add reservation / owner stay</h2><form id="booking"><label>Check-in<input id="start" type="date" required></label><label>Checkout<input id="end" type="date" required></label><label>Guest name (or Owner stay)<input id="guest"></label><label>Phone<input id="phone" type="tel"></label><label>Email<input id="contact" type="email"></label><label>Private notes<textarea id="notes"></textarea></label><button>Save reservation</button><button type="button" id="reset">Clear form</button></form></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm';const db=createClient('https://phohrctikcdjncxkfdhp.supabase.co','sb_publishable_Gs3tRVASd4T-wGVTqwfHAw_usP_0Nep');const $=id=>document.getElementById(id), owner='e856ce4a-37e4-4612-8091-246635fa3654';let editing=null;const msg=t=>$('status').textContent=t;function check(r){if(r.error)throw r.error;return r.data}function clear(){editing=null;$('booking').reset();$('formTitle').textContent='Add reservation / owner stay'}$('reset').onclick=clear;async function load(){const rows=check(await db.from('availability').select('id,check_in,check_out,private_bookings(guest_name,phone,email,notes)').order('check_in'));$('list').replaceChildren();for(const r of rows){const p=Array.isArray(r.private_bookings)?r.private_bookings[0]||{}:r.private_bookings||{};const a=document.createElement('article'),t=document.createElement('strong');t.textContent=r.check_in+' → '+r.check_out;a.append(t);const n=document.createElement('p');n.textContent=p.guest_name||'Reserved';a.append(n);for(const [label,value] of [['Phone',p.phone],['Email',p.email],['Notes',p.notes]])if(value){const s=document.createElement('small');s.textContent=label+': '+value;a.append(s)}const b=document.createElement('button');b.textContent='Edit';b.onclick=()=>{editing=r.id;$('start').value=r.check_in;$('end').value=r.check_out;$('guest').value=p.guest_name||'';$('phone').value=p.phone||'';$('contact').value=p.email||'';$('notes').value=p.notes||'';$('formTitle').textContent='Edit reservation';$('booking').scrollIntoView()};a.append(b);$('list').append(a)}}async function show(){try{const {data}=await db.auth.getUser();const ok=data.user?.id===owner;$('login').hidden=ok;$('dashboard').hidden=!ok;if(ok)await load();else $('list').replaceChildren()}catch(e){msg(e.message)}}$('login').onsubmit=async e=>{e.preventDefault();try{check(await db.auth.signInWithPassword({email:$('email').value,password:$('password').value}));$('password').value='';await show();msg($('dashboard').hidden?'Account not authorized.':'Signed in.')}catch(e){msg(e.message)}};$('logout').onclick=async()=>{await db.auth.signOut();clear();await show();msg('Signed out.')};$('booking').onsubmit=async e=>{e.preventDefault();try{const dates={check_in:$('start').value,check_out:$('end').value};if(dates.check_out<=dates.check_in)throw Error('Checkout must follow check-in.');const id=editing||crypto.randomUUID();check(editing?await db.from('availability').update(dates).eq('id',id):await db.from('availability').insert({id,...dates}));editing=id;check(await db.from('private_bookings').upsert({booking_id:id,guest_name:$('guest').value,phone:$('phone').value,email:$('contact').value,notes:$('notes').value}));clear();await load();msg('Reservation saved.')}catch(e){msg('Save incomplete: '+e.message+'. Check reservation list before retrying.')}};show();</script></html>
