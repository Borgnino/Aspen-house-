el>Phone<input id="phone" type="tel"></label><label>Email<input id="contact" type="email"></label><label>Booking total ($)<input id="total" type="number" min="0" step="0.01" inputmode="decimal"></label><label>Down payment / total received ($)<input id="paid" type="number" min="0" step="0.01" inputmode="decimal"></label><p><strong>Balance due: <output id="due">Not entered</output></strong></p><label>Private notes<textarea id="notes"></textarea></label><button>Save reservation</button><button type="button" id="clearBooking">Clear form</button></form></section></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm';const db=createClient('https://phohrctikcdjncxkfdhp.supabase.co','sb_publishable_Gs3tRVASd4T-wGVTqwfHAw_usP_0Nep',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=id=>document.getElementById(id), owner='e856ce4a-37e4-4612-8091-246635fa3654';let editing=null,allRows=[],guestNotes=[],monthDate=new Date(),selected=null;monthDate.setDate(1);function tab(name){for(const n of ['calendar','reservations','guests','settings'])$(n).hidden=n!==name;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name))}document.querySelectorAll('#tabs button').forEach(b=>b.onclick=async()=>{tab(b.dataset.tab);if(b.dataset.tab!=='settings'){try{await load()}catch(e){msg(e.message);alert(e.message)}}});tab('calendar');const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');const priv=r=>Array.isArray(r.private_bookings)?r.private_bookings[0]||{}:r.private_bookings||{};const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);const amount=id=>$(id).value===''?null:Number($(id).value);function calcDue(){$('due').textContent=amount('total')===null||amount('paid')===null?'Not entered':money(amount('total')-(amount('paid')??0))}function paymentBox(p){const box=document.createElement('div');box.className='payment';for(const [label,value] of [['Booking total',p.booking_total],['Down payment / received',p.down_payment],['Balance due',p.booking_total==null||p.down_payment==null?null:Number(p.booking_total)-Number(p.down_payment)]]){const row=document.createElement('div'),l=document.createElement('span'),v=document.createElement('strong');l.textContent=label;v.textContent=value==null?'Not entered':money(value);row.append(l,v);box.append(row)}return box}function paymentText(p){return 'Booking total: '+(p.booking_total==null?'Not entered':money(p.booking_total))+' · Received: '+(p.down_payment==null?'Not entered':money(p.down_payment))+' · Balance due: '+(p.booking_total==null?'Not entered':money(Number(p.booking_total)-Number(p.down_payment??0)))}$('total').oninput=$('paid').oninput=calcDue;function editRow(r){editing=r.id;const p=priv(r);$('start').value=r.check_in;$('end').value=r.check_out;$('guest').value=p.guest_name||'';$('phone').value=p.phone||'';$('contact').value=p.email||'';$('notes').value=p.notes||'';$('total').value=p.booking_total??'';$('paid').value=p.down_payment??'';calcDue();$('formTitle').textContent='Edit reservation';tab('reservations');$('booking').scrollIntoView()}function renderCalendar(){$('month').textContent=monthDate.toLocaleDateString('en-US',{month:'long',year:'numeric'});$('days').replaceChildren();for(const d of ['S','M','T','W','T','F','S']){let s=document.createElement('span');s.textContent=d;$('days').append(s)}for(let i=0;i<monthDate.getDay();i++)$('days').append(document.createElement('span'));for(let i=1;i<=new Date(monthDate.getFullYear(),monthDate.getMonth()+1,0).getDate();i++){let d=iso(new Date(monthDate.getFullYear(),monthDate.getMonth(),i)),r=allRows.find(r=>r.check_in<=d&&d<r.check_out),b=document.createElement('button');b.textContent=i;b.classList.toggle('busy',!!r);b.onclick=()=>{if(r)return editRow(r);clear();$('start').value=d;tab('reservations');$('booking').scrollI ations');$('booking').scrollIntoView()};const label=document.createElement('label');label.textContent='Permanent guest notes';const area=document.createElement('textarea');area.rows=4;area.value=guestNotes.find(n=>n.guest_key===key)?.notes||'';label.append(area);a.append(label);const save=document.createElement('button');save.textContent='Save guest notes';save.onclick=async()=>{save.disabled=true;try{const n=check(await db.from('guest_notes').upsert({guest_key:key,notes:area.value},{onConflict:'guest_key'}).select().single());guestNotes=guestNotes.filter(x=>x.guest_key!==key);guestNotes.push(n);save.textContent='Notes saved';}catch(e){alert('Could not save notes: '+e.message)}finally{save.disabled=false}};area.oninput=()=>save.textContent='Save guest notes';a.append(save,b);$('guestList').append(a)}}$('searchGuest').oninput=renderGuests;const msg=t=>$('status').textContent=t;function check(r){if(r.error)throw r.error;return r.data}function clear(){editing=null;HTMLFormElement.prototype.reset.call($('booking'));calcDue();$('formTitle').textContent='Add reservation / owner stay'}$('clearBooking').onclick=clear;async function load(){const dates=check(await db.from('availability').select('id,check_in,check_out').order('check_in'));const details=check(await db.from('private_bookings').select('booking_id,guest_name,phone,email,notes,booking_total,down_payment'));const rows=dates.map(r=>({...r,private_bookings:details.find(p=>p.booking_id===r.id)||{}}));guestNotes=check(await db.from('guest_notes').select('guest_key,notes'));allRows=rows;renderCalendar();renderGuests();$('list').replaceChildren();for(const r of rows){const p=Array.isArray(r.private_bookings)?r.private_bookings[0]||{}:r.private_bookings||{};const a=document.createElement('article'),t=document.createElement('strong');t.textContent=r.check_in+' → '+r.check_out;a.append(t);const n=document.createElement('p');n.textContent=p.guest_name||'Reserved';a.append(n);a.append(paymentBox(p));for(const [label,value] of [['Phone',p.phone],['Email',p.email],['Notes',p.notes]])if(value){const s=document.createElement('small');s.textContent=label+': '+value;a.append(s)}const b=document.createElement('button');b.textContent='Edit';b.onclick=()=>{editing=r.id;$('start').value=r.check_in;$('end').value=r.check_out;$('guest').value=p.guest_name||'';$('phone').value=p.phone||'';$('contact').value=p.email||'';$('notes').value=p.notes||'';$('total').value=p.booking_total??'';$('paid').value=p.down_payment??'';calcDue();$('formTitle').textContent='Edit reservation';$('booking').scrollIntoView()};a.append(b);$('list').append(a)}}async function show(){try{const session=await db.auth.getSession();const {data}=session.data.session?await db.auth.getUser():{data:{user:null}};const ok=data.user?.id===owner;$('login').hidden=ok;$('dashboard').hidden=!ok;if(ok)await load();else $('list').replaceChildren()}catch(e){msg(e.message)}}$('login').onsubmit=async e=>{e.preventDefault();try{check(await db.auth.signInWithPassword({email:$('email').value,password:$('password').value}));$('password').value='';await show();msg($('dashboard').hidden?'Account not authorized.':'Signed in.')}catch(e){msg(e.message)}};$('setPassword').onclick=()=>{$('dashboard').hidden=true;$('newPassword').hidden=false;};$('logout').onclick=async()=>{await db.auth.signOut();clear();await show();msg('Signed out.')};$('booking').onsubmit=async e=>{e.preventDefault();try{const dates={check_in:$('start').value,check_out:$('end').value};if(dates.check_out<=dates.check_in)throw Error('Checkout must follow check-in.');const id=editing||crypto.randomUUID();const existing=allRows.find(r=>r.id===id);if(!editing||!existing||existing.check_in!==dates.check_in||existing.check_out!==dates.check_out){check(editing?await db.from('availability').update(dates).eq('id',id).select().single():await db.from('availability').insert({id,...dates}).select().single());}editing=id;check(await db.from('private_bookings').upsert({booking_id:id,guest_name:$('guest'
